name: Correct v1.0.1 README reference (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct-readme-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Move only the verified documentation tag
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, json, urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='Lydiannnn/arkdown-releases'
          base='https://api.github.com/repos/Lydiannnn/arkdown-releases'
          old='7e09924a237c656e38a16d20bcd8acfca6a990ea'
          target='2085da3ea9d342d119bd68603e0e8c66bbd69267'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(route, method='GET', value=None):
              data=json.dumps(value).encode() if value is not None else None
              with urllib.request.urlopen(urllib.request.Request(base+route,data=data,headers=headers,method=method),timeout=45) as response:
                  return json.load(response)
          before=api('/releases/390952226')
          files=api('/compare/'+old+'...'+target)['files']
          assert [f['filename'] for f in files]==['README.md']
          current=api('/git/ref/tags/v1.0.1')['object']['sha']
          assert current in (old,target), 'The tag changed unexpectedly'
          if current!=target:
              api('/git/refs/tags/v1.0.1','PATCH',{'sha':target,'force':False})
          assert api('/git/ref/tags/v1.0.1')['object']['sha']==target
          after=api('/releases/390952226')
          assert [(a['id'],a['name'],a['digest'],a['size']) for a in before['assets']]==[(a['id'],a['name'],a['digest'],a['size']) for a in after['assets']]
          print('PASS: only v1.0.1 README reference corrected; release assets unchanged.')


